name: Keep Supabase Alive

on:
  schedule:
    # Runs every day at 12:00 UTC - daily pings prevent any inactivity gap
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual run from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        run: |
          SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"

          # Fallback to hardcoded project URL if secret is missing
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://wgufujxqmdqugcyzetaa.supabase.co"
          fi

          ENDPOINT="${SUPABASE_URL}/rest/v1/raw_journal?select=id&limit=1"
          echo "Pinging Supabase endpoint: ${ENDPOINT}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${ENDPOINT}")

          echo "Response HTTP Status Code: ${HTTP_STATUS}"

          # 540 = Supabase-specific "Project Paused" status - treat as hard failure
          if [ "$HTTP_STATUS" = "540" ]; then
            echo "CRITICAL: Supabase project is PAUSED (HTTP 540). Manual restore required at https://supabase.com/dashboard"
            exit 1
          fi

          # 000 = curl could not connect at all (network error / project offline)
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "CRITICAL: Could not connect to Supabase (HTTP 000). Project may be offline."
            exit 1
          fi

          # 2xx or 4xx = project is alive (401 Unauthorized is fine - project is active)
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "SUCCESS: Supabase is active (HTTP ${HTTP_STATUS}). Database kept alive!"
          else
            echo "ERROR: Unexpected HTTP response code ${HTTP_STATUS}"
            exit 1
          fi
