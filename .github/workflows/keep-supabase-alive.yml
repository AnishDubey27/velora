name: Keep Supabase Alive

on:
  schedule:
    # Runs twice every day (00:00 and 12:00 UTC) to guarantee active database transactions
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual run from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping & Heartbeat Supabase Postgres
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase & Perform Database Heartbeat
        id: ping
        run: |
          SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"

          # Fallback to hardcoded project URL and key if secrets are missing
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://wgufujxqmdqugcyzetaa.supabase.co"
          fi
          if [ -z "$SUPABASE_KEY" ]; then
            SUPABASE_KEY="sb_publishable_j2-EF2Ug44vEOPxMDoGsqw_C7j3zLMi"
          fi

          echo "Supabase Target: ${SUPABASE_URL}"

          # Step 1: Healthcheck GET endpoint
          READ_ENDPOINT="${SUPABASE_URL}/rest/v1/raw_journal?select=id&limit=1"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${READ_ENDPOINT}")
          CURL_EXIT=$?

          echo "GET Status: ${HTTP_STATUS} | curl exit: ${CURL_EXIT}"

          if [ "$CURL_EXIT" = "6" ] || [ "$CURL_EXIT" = "7" ]; then
            echo "CRITICAL: Cannot reach Supabase host (curl exit ${CURL_EXIT}). Project may be PAUSED."
            exit 1
          fi

          if [ "$HTTP_STATUS" = "540" ] || [ "$HTTP_STATUS" = "000" ]; then
            echo "CRITICAL: Supabase project is PAUSED (HTTP ${HTTP_STATUS})."
            exit 1
          fi

          # Step 2: Real Postgres Transaction (INSERT + DELETE)
          # Supabase requires active database transactions to reset the 7-day inactivity timer
          WRITE_ENDPOINT="${SUPABASE_URL}/rest/v1/raw_journal"
          WRITE_RESP=$(curl -s -w "\n%{http_code}" \
            --max-time 15 \
            -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"phase":"heartbeat","raw_text":"automated-keepalive-ping"}' \
            "${WRITE_ENDPOINT}")

          WRITE_STATUS=$(echo "$WRITE_RESP" | tail -n1)
          WRITE_BODY=$(echo "$WRITE_RESP" | sed '$d')

          echo "POST Status: ${WRITE_STATUS}"

          # Extract row ID if created
          ROW_ID=$(echo "$WRITE_BODY" | grep -o '"id":"[^"]*' | head -n1 | cut -d'"' -f4)

          if [ -n "$ROW_ID" ]; then
            echo "Heartbeat row created (ID: ${ROW_ID}). Cleaning up row..."
            DEL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              -X DELETE \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              "${WRITE_ENDPOINT}?id=eq.${ROW_ID}")
            echo "DELETE cleanup status: ${DEL_STATUS}"
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "SUCCESS: Supabase database heartbeat verified and active!"
          else
            echo "ERROR: Unexpected status code: ${HTTP_STATUS}"
            exit 1
          fi

  alert-on-failure:
    name: Alert on Supabase Failure
    runs-on: ubuntu-latest
    needs: ping-supabase
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create GitHub Issue Alert
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Supabase project PAUSED — ${new Date().toISOString().split('T')[0]}`;
            const body = `## Supabase Project is Paused or Unreachable

            The daily keep-alive ping **failed**. Your Supabase free-tier project (\`barebone\`) has likely been auto-paused.

            ### Action Required
            1. Go to [Supabase Dashboard](https://supabase.com/dashboard/project/wgufujxqmdqugcyzetaa)
            2. Click **Restore project**
            3. Wait ~2 minutes for it to come back online

            ### Workflow Run
            [View failing run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---
            *This issue was auto-created by the Keep Supabase Alive workflow.*`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'supabase-alert'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['supabase-alert', 'urgent']
              });
              console.log('Created alert issue.');
            } else {
              console.log('Alert issue already open — skipping duplicate.');
            }
